name: Native store readiness
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/native-readiness.yml'
      - 'native/**'
      - 'ci/*native*'
      - 'ci/build-keychain.sh'
      - 'export_presets.cfg'
concurrency:
  group: native-readiness-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  ios:
    if: github.event.repository.private == false
    runs-on: macos-15-intel
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Record standard runner and selected Xcode
        run: |
          test "${{ runner.environment }}" = github-hosted
          xcode-select -p
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - run: bash ci/install-native.sh
      - name: Stage public assets once
        env:
          TONSAI_STAGE_ONLY: '1'
          SURVIVOR_WSS_ENDPOINT: wss://survivor-island-phase3c.onrender.com/ws
        run: bash ci/build-tonsai.sh
      - name: Compile device and simulator Keychain plugin
        run: bash ci/build-keychain.sh
      - name: Export unsigned Xcode project
        run: |
          mkdir -p build/ios
          "$GODOT_BIN" --headless --path build/tonsai-project --editor --import --quit
          "$GODOT_BIN" --headless --path build/tonsai-project --export-release "iOS Readiness" "$PWD/build/ios/SurvivorIsland.zip"
          test -d build/ios/SurvivorIsland.xcodeproj
      - name: Compile unsigned device application
        run: |
          xcodebuild -project build/ios/SurvivorIsland.xcodeproj -scheme SurvivorIsland -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/ios-device CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Compile simulator application
        run: |
          xcodebuild -project build/ios/SurvivorIsland.xcodeproj -scheme SurvivorIsland -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build/ios-simulator CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Boot available simulator and launch
        run: python3 ci/start-simulator.py
  android:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: bash ci/install-godot-web.sh
      - run: |
          echo "GODOT_BIN=$HOME/.local/bin/godot-4.7.2" >> "$GITHUB_ENV"
          export PATH="$HOME/.local/bin:$PATH"
          ln -s "$HOME/.local/bin/godot-4.7.2" "$HOME/.local/bin/godot"
          bash ci/install-native.sh
      - run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.1.0" "ndk;29.0.14206865"
      - name: Stage shared public-safe game
        env:
          TONSAI_STAGE_ONLY: '1'
          SURVIVOR_WSS_ENDPOINT: wss://survivor-island-phase3c.onrender.com/ws
        run: bash ci/build-tonsai.sh
      - name: Export unsigned ARM64 AAB
        run: |
          mkdir -p build/android
          timeout 600 "$GODOT_BIN" --headless --path build/tonsai-project --install-android-build-template --export-release "Android Readiness" "$PWD/build/android/SurvivorIsland.aab"
          unzip -l build/android/SurvivorIsland.aab | tee build/android/contents.txt
          grep 'base/lib/arm64-v8a/libgodot_android.so' build/android/contents.txt
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-android-readiness
          path: build/android/
          retention-days: 7
